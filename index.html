    <title>Akvega — Growth marketing and digital build, one team</title>
    <!--
      Description, og: and twitter: copy track src/lib/site.ts. They previously
      described a "design studio working across brand systems, digital product,
      and motion", which is not what the site sells — keep them in step with the
      two-track Growth/Build positioning if that copy changes.
    -->
    <meta
      name="description"
      content="Akvega runs growth marketing and digital build under one roof — search, ads and social alongside websites, apps and custom systems."
    />
    <link rel="canonical" href="https://akvega.com/" />
    <meta name="theme-color" content="#ffffff" />

    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/logo.svg" />

    <!--
      Two font families from Google Fonts. `preconnect` covers both the CSS host
      and the font host; without the second one the woff2 fetch pays a fresh
      connection setup after the stylesheet has already resolved.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Akvega" />
    <meta property="og:url" content="https://akvega.com/" />
    <meta property="og:title" content="Akvega — Growth marketing and digital build, one team" />
    <meta
      property="og:description"
      content="Search, ads and social alongside websites, apps and custom systems. The team buying the traffic is the team shipping the page it arrives on."
    />
    <!--
      No og:image yet. A share card wants a 1200×630 raster; the only brand
      assets on hand are SVG wordmarks, which most scrapers will not render.
      Add public/og.png and point og:image / twitter:image at it before launch.
    -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Akvega — Growth marketing and digital build, one team" />
    <meta
      name="twitter:description"
      content="Search, ads and social alongside websites, apps and custom systems, from one team."
    />
  </head>
